name: Update Nix vendorHash

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - go.mod
      - go.sum
  workflow_dispatch:

concurrency:
  group: nix-vendor-hash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-vendor-hash:
    name: Update vendorHash
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.user.login == 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Update vendor hash
        run: nix develop .#ci --command nix-update --flake --version=skip jailoc
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- flake.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Format flake
        if: steps.diff.outputs.changed == 'true'
        run: nix fmt .
      - name: Verify flake
        if: steps.diff.outputs.changed == 'true'
        run: nix flake check
      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: nix build
      - name: Verify run
        if: steps.diff.outputs.changed == 'true'
        run: nix run . -- --help
      - name: Update Dependabot branch
        if: github.event_name == 'pull_request' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- flake.nix; then
            exit 0
          fi
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit --only \
            -m 'chore(nix): update vendorHash [dependabot skip]' -- flake.nix
          # The commit's parent is the original PR head; concurrent advances reject this push.
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        with:
          token: ${{ github.token }}
          base: main
          add-paths: flake.nix
          branch: chore/nix-vendor-hash-update
          commit-message: "chore(nix): update vendorHash"
          title: "chore(nix): update vendorHash"
          body: "Automated vendorHash update after go.mod/go.sum changes."
